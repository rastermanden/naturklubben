<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166534" />
    <meta
      name="description"
      content="Naturklubbens medlemsapp: kalender, billeder og chat."
    />
    <title>Naturklubben</title>
    <!-- Temaet afgøres, før siden tegnes, så en mørk app ikke blinker hvidt ved
         opstart. Nøglen og værdierne skal matche src/features/theme/theme.ts. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('naturklubben:theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'auto' || stored === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
