# Supabase Preview Branching deploys functions declared here, so PR previews can
# exercise the public submission boundary against the PR's own database.
[functions.calendar-feed]
enabled = true
verify_jwt = false

[functions.submit-probation-application]
enabled = true
verify_jwt = false

[functions.report-client-error]
enabled = true
verify_jwt = false

[functions.export-account]
enabled = true
verify_jwt = true
