name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Hele historikken og alle tags: vite.config.ts bygger appens
          # viste version med `git describe --tags`, og en shallow checkout
          # uden tags ville altid give den bare commit-sha.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: V2/package-lock.json

      - name: Install
        working-directory: V2
        run: npm ci

      # V2 på produktionsadressen. Deployment-URL'en kommer fra prod-nøglen,
      # ikke fra en gemt variabel, så buildet ikke kan pege på et preview.
      - name: Deploy Convex og byg
        working-directory: V2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VITE_BASE_PATH: /
        run: |
          set -euo pipefail
          npx convex deploy \
            --cmd 'npm run build' \
            --cmd-url-env-var-name VITE_CONVEX_URL
          printf '%s' "$RESEND_API_KEY" | npx convex env set RESEND_API_KEY
          npx convex env set SITE_URL https://naturklubben.dk
          # Uden nøgleparret kan en gyldig nulstillingskode ikke udstede en
          # session. Klienten bliver så hængende på "Et øjeblik…". Preview
          # sætter nøglerne selv; prod arver dem ikke.
          node scripts/ensurePreviewAuthKeys.mjs prod
          if [[ -f ../.github/AUTH_RESET_SMOKE ]]; then
            while read -r smoke_action smoke_email; do
              if [[ -z "${smoke_action:-}" ]]; then
                continue
              fi
              AUTH_SMOKE_CONFIRM=RESET_SMOKE node scripts/authResetSmoke.mjs "$smoke_action" "$smoke_email"
            done < ../.github/AUTH_RESET_SMOKE
          fi
          host=$(grep -RhoE 'https://[a-z0-9-]+\.convex\.cloud' dist/assets | sort -u | grep -v 'happy-otter-123')
          echo "Build peger på $host"
          if [[ "$host" != *quaint-parakeet-652* ]]; then
            echo "Produktionsbuildet peger ikke på prod."
            exit 1
          fi

      # Deployer til roden af gh-pages-branchen. clean: false bevarer
      # pr-preview/pr-<nr>/-undermapperne, som pr-preview.yml pusher til samme branch.
      #
      # gh-pages har to skrivere, og de rammer hinanden ved hver eneste merge:
      # når en PR merges, starter dette job og pr-preview.yml's oprydning
      # ("Remove preview for PR <nr>") i samme sekund. De kan ikke deles om en
      # concurrency-gruppe -- en fælles gruppe ville lade et nyt preview
      # annullere en ventende produktions-deploy, og GitHub holder kun én
      # ventende kørsel pr. gruppe. Derfor skal et afvist push i stedet hentes
      # ind og prøves igen: denne action fetcher og rebaser ved afvisning
      # (op til `attempt-limit` forsøg), så længe `force` er slået fra.
      # Uden det taber den ene part stille sit build -- sådan forsvandt
      # deployet af 48b1396, hvor appen blev bygget færdig og så smidt væk.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: V2/dist
          clean: false
          force: false
          attempt-limit: 5
          commit-message: 'deploy: ${{ github.sha }}'
