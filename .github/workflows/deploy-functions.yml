name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Secret-navne der starter med SUPABASE_ er reserverede af
      # platformen og injiceres automatisk i alle Edge Functions -- de
      # kan ikke (og skal ikke) sættes manuelt med `supabase secrets set`.
      # optimize-image læser derfor Secret key direkte fra det
      # auto-injicerede miljø (se index.ts).
      - name: Deploy optimize-image
        run: supabase functions deploy optimize-image --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
