name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned frem for "latest" -- "latest" beder actionen om at slå den
      # nyeste release op via GitHub's API, som er stødt på rate limiting
      # og fejlet deploys uden relation til selve koden.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Secret-navne der starter med SUPABASE_ er reserverede af
      # platformen og injiceres automatisk i alle Edge Functions -- de
      # kan ikke (og skal ikke) sættes manuelt med `supabase secrets set`.
      # optimize-image læser derfor Secret key direkte fra det
      # auto-injicerede miljø (se index.ts).
      - name: Deploy optimize-image
        run: supabase functions deploy optimize-image --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # VAPID-nøgleparret identificerer afsenderen over for browsernes
      # push-tjenester (RFC 8292) og er ikke reserveret af platformen, så det
      # skal sættes eksplicit. Det sker her -- ikke fra nogens terminal --
      # og kun når nøglerne findes som repo-secrets, så en tom værdi ikke
      # overskriver en fungerende opsætning.
      # Repo-secrets er *valgfrie*: findes de ikke, genererer chat-push selv et
      # nøglepar første gang og gemmer det i push_vapid_keys (se vapid.ts).
      # Det er den normale vej -- at oprette et repo-secret er et manuelt
      # dashboard-trin, og det er præcis det, projektet undgår.
      # Tjekket ligger i shellen, ikke i en `if:` -- secrets-konteksten er
      # ikke tilgængelig i et steps `if:`-udtryk.
      - name: Sæt VAPID-secrets
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::notice::VAPID_PUBLIC_KEY/VAPID_PRIVATE_KEY er ikke sat som repo-secrets. Det er fint -- chat-push genererer selv et nøglepar og gemmer det i push_vapid_keys."
            exit 0
          fi
          supabase secrets set \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="$VAPID_SUBJECT" \
            --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || 'mailto:naturklubben@example.com' }}

      - name: Deploy chat-push
        run: supabase functions deploy chat-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy calendar-feed
        run: supabase functions deploy calendar-feed --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy probation-notifications
        # Postgres køer leveringen med pg_net efter commit og autoriserer hvert
        # request med ansøgningens tilfældige token. Functionen laver selv samme
        # token/admin-kontrol, så gateway-JWT er bevidst slået fra for dette ene
        # server-til-server endpoint.
        run: supabase functions deploy probation-notifications --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
