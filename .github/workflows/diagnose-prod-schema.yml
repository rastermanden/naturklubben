# MIDLERTIDIG diagnose (produktionsfejl i chatten).
#
# Migrationer deployes af Supabase's GitHub-app, ikke af en workflow, så der
# findes intet spor i Actions af, om en migration faktisk er kørt på
# produktionen. Denne workflow spørger produktionsprojektet gennem
# Management API'et -- samme mønster og samme secrets som
# sync-auth-config.yml -- og kører i GitHub's runners, så den kræver hverken
# lokalt værktøj eller dashboard-adgang.
#
# Alle forespørgsler er rene SELECT'er på skema-metadata. De navne, der
# skrives i loggen, står i forvejen i repoets migrationer, så en offentlig
# jobslog afslører intet nyt. Tokenet bruges kun i Authorization-headeren.
#
# Slettes igen, når fejlen er fundet.

name: Diagnosticér produktionsskema

on:
  workflow_dispatch:
  push:
    branches: [claude/issues-100-101-b16auj]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Læs skema-tilstand fra produktionsdatabasen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF mangler."
            exit 1
          fi

          run_query() {
            label="$1"
            sql="$2"
            body=$(jq -n --arg q "$sql" '{query: $q}')
            resp=$(mktemp)
            status=$(curl -sS --max-time 30 -o "$resp" -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$body")
            echo "=== $label (HTTP $status)"
            jq -c . "$resp" 2>/dev/null || cat "$resp"
            echo
          }

          run_query "Kørte migrationer" \
            "select version from supabase_migrations.schema_migrations order by version"

          run_query "Kolonner på messages" \
            "select column_name from information_schema.columns where table_schema = 'public' and table_name = 'messages' order by column_name"

          run_query "Constraints på messages" \
            "select conname from pg_constraint where conrelid = 'public.messages'::regclass order by conname"

          run_query "Tabeller fra nyere migrationer" \
            "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('message_reactions', 'event_attendance', 'activities') order by table_name"

          # Skemaet er i orden, så fejlen må ligge i PostgREST's schema-cache.
          # Supabase genindlæser den via en event trigger på DDL; findes den
          # ikke, opdager API'et aldrig nye relationer.
          run_query "Event triggers" \
            "select evtname, evtenabled from pg_event_trigger order by evtname"

      - name: Gentag klientens forespørgsel mod produktions-API'et
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY mangler -- API-tjekket blev sprunget over."
            exit 0
          fi

          # Uden login rammer vi RLS, ikke rækker -- men PGRST200 om en manglende
          # relation afgøres *før* RLS, så svaret her viser præcis, om API'et
          # kan se svar-relationen. Nøglen er den offentlige publishable key,
          # som i forvejen ligger i den udgivne frontend.
          rest_get() {
            label="$1"
            path="$2"
            resp=$(mktemp)
            status=$(curl -sS --max-time 30 -o "$resp" -w '%{http_code}' \
              -G "${SUPABASE_URL%/}/rest/v1/$path" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            echo "=== $label (HTTP $status)"
            head -c 1500 "$resp"
            echo
            echo
          }

          rest_get "Beskeder uden embed" \
            "messages?select=id&limit=1"

          rest_get "Beskeder med svar-embed (klientens forespørgsel)" \
            "messages?select=id,reply_to:messages!messages_reply_to_message_id_fkey(id,user_id,content)&limit=1"

          rest_get "Beskeder med de nye slette-kolonner" \
            "messages?select=id,deleted_at,deleted_by&limit=1"
