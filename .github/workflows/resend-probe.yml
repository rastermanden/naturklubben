name: Prøv Resend

# Én mail til Martin. Nøglen sættes på previewet kun mens prøven kører
# og fjernes igen, så previewet bliver ved med at logge mails.
# Modtageren er fast i convex/emailProbe.ts.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview-navn, fx pr-277'
        required: true
        default: pr-277

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: V2/package-lock.json

      - name: Install
        working-directory: V2
        run: npm ci

      - name: Send én prøvemail og fjern nøglen igen
        working-directory: V2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          preview="${{ inputs.preview }}"
          case "$preview" in
            pr-*) ;;
            *) echo "Preview-navnet skal starte med pr-."
              exit 1
              ;;
          esac
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "Mangler RESEND_API_KEY."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx convex env set RESEND_API_KEY --preview-name "$preview"
          set +e
          npx convex run emailProbe:send '{}' --preview-name "$preview"
          status=$?
          set -e
          npx convex env remove RESEND_API_KEY --preview-name "$preview"
          exit "$status"
