name: PR Preview V2 (Convex)

# Preview for V2: hver PR får sit eget Convex-deployment og sit eget
# frontend-build, der peger på det. Det er den nærmeste pendant til Supabase's
# Preview Branch, som den gamle app bruger i `pr-preview.yml`.
#
# To ting fra Convex-dokumentationen, som workflowet bygger på:
#
# - `npx convex deploy` med en **preview deploy key** opretter (eller genbruger)
#   et midlertidigt deployment pr. navn. `--preview-name` gør navnet "pr-<nr>",
#   så det er stabilt mellem kørsler, selv om branchenavnet ændrer sig.
# - `--cmd-url-env-var-name VITE_CONVEX_URL` kører build-kommandoen *efter*
#   deployet med deploymentets URL i den variabel. Derfor skal URL'en ikke
#   gættes eller læses ud af dashboardet.
#
# Forbehold, som ikke kan kodes væk:
#
# - Preview-deployments er en **beta-funktion** hos Convex og ryddes automatisk
#   efter 5 dage (14 på de betalte planer). En gammel PRs preview kan altså være
#   væk, selv om PR'en stadig er åben.
# - Deploymentet starter **tomt**. Der er ingen kopi af produktionsdata.
#   Efter deploy kører `previewSeed:ensure`, som opretter testbrugeren fra
#   repo-secrets (se AGENTS.md). Det kører aldrig mod produktion.
# - PR'er fra forks får ingen secrets og kan derfor ikke bygge et preview, og
#   PR'er fra Copilot coding agent skal have deres workflows godkendt manuelt.
#   Det er samme begrænsning som i `pr-preview.yml`.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-v2-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Versionsstrengen i footeren bygges med `git describe --tags`; en
          # shallow checkout uden tags giver altid den bare commit-sha.
          fetch-depth: 0

      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: V2/package-lock.json

      - if: github.event.action != 'closed'
        name: Install
        working-directory: V2
        run: npm ci

      # Backend og frontend i ét trin: `--cmd` kører buildet, når deploymentet
      # findes, og giver dets URL videre som VITE_CONVEX_URL. Fejler deployet,
      # bliver der intet build -- hvilket er meningen: et preview uden backend
      # er en hvid side med en grøn check.
      - if: github.event.action != 'closed'
        name: Deploy preview-deployment og byg mod det
        working-directory: V2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VITE_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
        run: |
          npx convex deploy \
            --preview-name "pr-${{ github.event.number }}" \
            --cmd 'npm run build' \
            --cmd-url-env-var-name VITE_CONVEX_URL

      # VITE_CONVEX_URL inlines i bundlen af deployet ovenfor. Den skal være
      # previewets vært, ikke produktion (quaint-parakeet-652 har intet skema).
      - if: github.event.action != 'closed'
        name: Tjek at buildet peger på preview-deploymentet
        working-directory: V2
        run: |
          set -euo pipefail
          # ConvexReactClient har eksempel-URL'en happy-otter-123 i en
          # fejltekst, så den ligger altid i bundlen. Den er ikke deploymentet.
          mapfile -t hosts < <(grep -RhoE 'https://[a-z0-9-]+\.convex\.cloud' dist/assets | sort -u | grep -v 'happy-otter-123' || true)
          if [ "${#hosts[@]}" -eq 0 ]; then
            echo "Ingen Convex-vært i dist/assets. Buildet har ikke fået VITE_CONVEX_URL."
            exit 1
          fi
          echo "Convex-værter i preview-buildet:"
          printf '%s\n' "${hosts[@]}"
          if [ "${#hosts[@]}" -ne 1 ]; then
            echo "Preview-buildet indeholder mere end én Convex-vært."
            exit 1
          fi
          if [[ "${hosts[0]}" == *quaint-parakeet-652* ]]; then
            echo "Preview-buildet peger på produktions-deploymentet."
            exit 1
          fi

      # Hemmelighederne sættes via stdin. `env set` uden --secret skriver kun
      # navnet i loggen. `convex run` skriver funktionens returværdi, som er
      # `{ ok: true }` og ikke indeholder adressen eller adgangskoden.
      # --preview-run duer ikke her: den kører kun, første gang deploymentet
      # oprettes, og et eksisterende preview skal seede på hvert push.
      - if: github.event.action != 'closed'
        name: Opret testbruger på preview-deploymentet
        working-directory: V2
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PREVIEW_TEST_EMAIL: ${{ secrets.PREVIEW_TEST_EMAIL }}
          PREVIEW_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY}" ]; then
            echo "Mangler preview-nøgle."
            exit 1
          fi
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "Mangler RESEND_API_KEY."
            exit 1
          fi
          case "${CONVEX_DEPLOY_KEY}" in
            prod:*)
              echo "Afviser prod-nøgle. Seed kører kun mod preview."
              exit 1
              ;;
          esac
          preview="pr-${{ github.event.number }}"
          npx convex env set PREVIEW_SEED 1 --preview-name "$preview"
          npx convex env set SITE_URL https://naturklubben.dk --preview-name "$preview"
          npx convex env set ASSISTANT_MENTION_EMAIL naturklubben-test@agentmail.to --preview-name "$preview"
          printf '%s' "$PREVIEW_TEST_EMAIL" | npx convex env set PREVIEW_TEST_EMAIL --preview-name "$preview"
          printf '%s' "$PREVIEW_TEST_PASSWORD" | npx convex env set PREVIEW_TEST_PASSWORD --preview-name "$preview"
          # Nøglen bliver liggende. Hvert preview-deploy sætter den igen,
          # så et senere push ikke falder tilbage til at logge mailen.
          # Uden --secret skriver loggen kun navnet.
          printf '%s' "$RESEND_API_KEY" | npx convex env set RESEND_API_KEY --preview-name "$preview"
          npx convex run previewSeed:ensure '{}' --preview-name "$preview"
          ready=$(npx convex run previewSeed:guestAllowlistReady '{}' --preview-name "$preview")
          printf '%s\n' "$ready"
          node --input-type=module -e '
            const raw = process.argv[1]
            const data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1))
            if (
              data.listed !== data.expected ||
              data.expected < 7 ||
              data.allowlistAdmins !== data.expectedAdmins ||
              (data.martinHasProfile && data.martinAdmin !== true)
            ) {
              console.error("Adgangslisten eller admin-rollen mangler")
              process.exit(1)
            }
          ' "$ready"
          # Login kan først udstede en session, når Convex Auth har et
          # nøglepar på selve previewet. Prod-nøglerne følger ikke med.
          node scripts/ensurePreviewAuthKeys.mjs "$preview"

      # `pr-preview.yml` udgiver ikke, når PR'en rører V2/. Derfor er der
      # ingen venten på V1: den kørsel pushede alligevel til gh-pages efter
      # V2, fordi status "completed" ikke garanterede, at V1's push var den
      # sidste.

      # Samme action som den gamle app bruger: den lægger buildet i
      # pr-preview/pr-<nr>/ på gh-pages og fjerner mappen igen, når PR'en
      # lukkes (event-typen `closed` ovenfor).
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./V2/dist
          # Sitet har eget domæne (public/CNAME); uden dette skriver actionen
          # preview-linket som rastermanden.github.io/naturklubben/...
          pages-base-url: naturklubben.dk

      # CDN'en kan stadig have V1 et øjeblik efter push til gh-pages.
      - if: github.event.action != 'closed'
        name: Tjek at det udgivne preview er V2
        working-directory: V2
        run: |
          set -euo pipefail
          host=$(grep -RhoE 'https://[a-z0-9-]+\.convex\.cloud' dist/assets | sort -u | grep -v 'happy-otter-123')
          expected=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          url="https://naturklubben.dk/pr-preview/pr-${{ github.event.number }}/"
          # GitHub Pages cacher i op til 10 minutter. Et query-parameter
          # rammer en ny cache-nøgle, så vi ikke bliver ved med at se V1.
          # Filnavnet skal være dette builds, ikke et ældre V2-build med
          # samme Convex-vært.
          for attempt in $(seq 1 18); do
            cb=$(date +%s)
            html=$(curl -fsS "$url?cb=$cb" || true)
            js=$(printf '%s' "$html" | grep -oE 'assets/index-[^"]+\.js' | head -1 || true)
            if [ "$js" = "$expected" ]; then
              body=$(curl -fsS "$url$js?cb=$cb" || true)
              # Uden -q: med pipefail lukker grep -q røret, og printf dør
              # af SIGPIPE, så et rigtigt match bliver talt som fejl.
              if printf '%s' "$body" | grep -F "$host" >/dev/null && ! printf '%s' "$body" | grep -F 'supabase.co' >/dev/null; then
                echo "Live bundle $js peger på $host og ikke på Supabase."
                for route in kalender aktiviteter profil medlemmer login; do
                  code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url$route?cb=$cb")
                  echo "/$route -> $code"
                  if [ "$code" != "200" ]; then
                    echo "Forventede HTTP 200 på /$route."
                    exit 1
                  fi
                done
                exit 0
              fi
            fi
            echo "Live bundle ${js:-mangler} er ikke $expected (forsøg $attempt)."
            sleep 10
          done
          echo "Previewet peger ikke på $host."
          exit 1

      # Bekræfter, at det udgivne preview kan logge ind med den seedede bruger
      # og viser prøvedata. Puppeteer hentes kun til dette trin.
      - if: github.event.action != 'closed'
        name: Log ind som testbruger
        env:
          PREVIEW_TEST_EMAIL: ${{ secrets.PREVIEW_TEST_EMAIL }}
          PREVIEW_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
          PREVIEW_PATH: /pr-preview/pr-${{ github.event.number }}/
          PUPPETEER_REQUIRE_FROM: /tmp/preview-smoke/package.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/preview-smoke
          npm init -y --prefix /tmp/preview-smoke >/dev/null
          npm install --prefix /tmp/preview-smoke --silent puppeteer@24.15.0
          node V2/scripts/previewLoginSmoke.mjs

      # Samme session som testbrugeren. Mutationen er den, spillet kalder,
      # og siden skal vise rækken bagefter.
      - if: github.event.action != 'closed'
        name: Gem et Boble-resultat og se det på listen
        env:
          PREVIEW_TEST_EMAIL: ${{ secrets.PREVIEW_TEST_EMAIL }}
          PREVIEW_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
          PREVIEW_PATH: /pr-preview/pr-${{ github.event.number }}/
          PUPPETEER_REQUIRE_FROM: /tmp/preview-smoke/package.json
        run: node V2/scripts/previewBobleScore.mjs
