name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: github.event.action != 'closed'
        run: npm ci

      # Preview-appen skal tale med PR'ens egen Supabase Preview Branch -- ikke
      # med produktionsdatabasen. Ellers tester man ny UI mod det gamle skema:
      # migrationer i PR'en er usynlige i preview'et, og alt hvad de tilføjer
      # (tabeller, kolonner, RLS-policies) ser ud til at mangle.
      #
      # MEN: Supabase's GitHub-integration opretter kun en Preview Branch for
      # PR'er, der rører `supabase/`-mappen. For alle andre PR'er skriver botten
      # "This pull request has been ignored ... because there are no changes
      # detected in supabase directory" og laver ingen branch. Derfor afgør vi
      # først, om PR'ens diff overhovedet rører `supabase/`:
      #
      #   - Rører den `supabase/` → der SKAL komme en branch. Vi poller på den,
      #     og fejler buildet, hvis den udebliver: et preview af en migration
      #     mod produktionsskemaet ville være direkte misvisende.
      #   - Rører den ikke `supabase/` → PR'en indfører ingen skemaændringer, så
      #     produktionsskemaet ér PR'ens skema. Vi kigger kort efter en branch
      #     alligevel (i tilfælde af at integrationens indstilling er ændret til
      #     "alle PR'er"), og bygger ellers mod produktion.
      #
      # Branch-projektets ref og publishable key hentes fra Management API'et og
      # skrives til GITHUB_ENV, hvor build-trinnet nedenfor samler dem op.
      - if: github.event.action != 'closed'
        name: Find PR'ens Supabase Preview Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PARENT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          GIT_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
          FALLBACK_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          FALLBACK_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Bruges, når der hverken er eller kommer en Preview Branch. Det er kun
          # forsvarligt, når PR'en ingen skemaændringer har (eller når branching
          # slet ikke er tilgængelig for kørslen, fx en fork-PR uden secrets) --
          # og det skal siges højt, ikke ske i stilhed.
          use_production() {
            echo "::warning::$1 -- preview'et bygges mod PRODUKTIONS-Supabase."
            {
              echo "VITE_SUPABASE_URL=$FALLBACK_URL"
              echo "VITE_SUPABASE_PUBLISHABLE_KEY=$FALLBACK_KEY"
            } >> "$GITHUB_ENV"
            echo "⚠️ Preview bygget mod **produktions**-databasen: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PARENT_REF:-}" ]; then
            use_production "SUPABASE_ACCESS_TOKEN eller SUPABASE_PROJECT_REF er ikke sat"
          fi

          api() {
            curl -sS --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$1"
          }

          # Hele PR'ens diff mod base -- ikke kun sidste push. Det er samme
          # datagrundlag, som Supabase's integration selv bruger.
          touches_supabase=false
          page=1
          while [ "$page" -le 10 ]; do
            files=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$page")
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$files"; then
              # Kan vi ikke se diffen, antager vi det dyre tilfælde: PR'en kan
              # indeholde migrationer, og så må vi ikke falde tilbage til produktion.
              echo "::warning::Kunne ikke hente PR'ens filliste -- antager ændringer i supabase/."
              touches_supabase=true
              break
            fi
            if jq -e 'any(.[]; .filename | startswith("supabase/"))' >/dev/null 2>&1 <<<"$files"; then
              touches_supabase=true
              break
            fi
            if [ "$(jq 'length' <<<"$files")" -lt 100 ]; then break; fi
            page=$((page + 1))
          done

          if [ "$touches_supabase" = true ]; then
            # ~4 minutter. Branchen plejer at være oprettet efter under ét.
            attempts=24
            echo "PR'en ændrer filer i supabase/ -- venter på dens Preview Branch."
          else
            # Kort høflighedspoll: normalt findes der ingen branch at vente på.
            attempts=3
            echo "PR'en ændrer ingen filer i supabase/ -- Supabase opretter derfor normalt ingen Preview Branch."
          fi

          branch_ref=""
          publishable=""

          for attempt in $(seq 1 "$attempts"); do
            if [ -z "$branch_ref" ]; then
              branches=$(api "https://api.supabase.com/v1/projects/$PARENT_REF/branches")
              if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$branches"; then
                # is_default er produktions-branchen; den må vi aldrig ramme her.
                branch_ref=$(jq -r --arg b "$GIT_BRANCH" --arg pr "$PR_NUMBER" '
                  map(select(
                    (.is_default // false) != true
                    and (((.git_branch // "") == $b) or (((.pr_number // 0) | tostring) == $pr))
                  ))
                  | .[0]
                  | (.project_ref // .ref // empty)
                ' <<<"$branches")
              fi
            fi

            if [ -n "$branch_ref" ]; then
              keys=$(api "https://api.supabase.com/v1/projects/$branch_ref/api-keys?reveal=true")
              if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$keys"; then
                # Nyt nøglesystem først (sb_publishable_...), ellers den gamle anon-JWT.
                publishable=$(jq -r '
                  (map(select((.type // "") == "publishable")) | .[0].api_key)
                  // (map(select((.name // "") == "anon")) | .[0].api_key)
                  // empty
                ' <<<"$keys")
              fi
            fi

            [ -n "$branch_ref" ] && [ -n "$publishable" ] && break
            echo "Venter på Supabase Preview Branch for '$GIT_BRANCH' (forsøg $attempt/$attempts)…"
            if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
          done

          if [ -z "$branch_ref" ] || [ -z "$publishable" ]; then
            if [ "$touches_supabase" != true ]; then
              use_production "PR'en har ingen ændringer i supabase/, så Supabase opretter ingen Preview Branch"
            fi
            echo "::error::Kunne ikke finde en Supabase Preview Branch for '$GIT_BRANCH'."
            echo "PR'en ændrer filer i supabase/, så der burde være oprettet en branch." >&2
            echo "Tjek at Preview Branching er slået til for projektet (se issue #2)," >&2
            echo "og at SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_REF stadig er gyldige." >&2
            exit 1
          fi

          echo "::add-mask::$publishable"
          {
            echo "VITE_SUPABASE_URL=https://$branch_ref.supabase.co"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable"
          } >> "$GITHUB_ENV"
          echo "✅ Preview bygget mod Supabase Preview Branch \`$branch_ref\`." >> "$GITHUB_STEP_SUMMARY"

      - if: github.event.action != 'closed'
        name: Build preview
        # VITE_SUPABASE_* kommer fra trinnet ovenfor via GITHUB_ENV og må derfor
        # ikke sættes her -- en env-nøgle på selve trinnet ville overskrive dem
        # med produktionsværdierne igen. Vite-configen fejler buildet, hvis de
        # er tomme.
        run: npm run build
        env:
          VITE_BASE_PATH: /naturklubben/pr-preview/pr-${{ github.event.number }}/

      # Håndterer både deploy (åbnet/opdateret PR) og oprydning (lukket PR)
      # automatisk ud fra event-typen ovenfor.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
