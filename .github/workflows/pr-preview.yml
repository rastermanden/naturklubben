name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Hele historikken og alle tags: vite.config.ts bygger appens
          # viste version med `git describe --tags`, og en shallow checkout
          # uden tags ville altid give den bare commit-sha.
          fetch-depth: 0

      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - if: github.event.action != 'closed'
        run: npm ci

      # Supabase er kilden til sandhed: hvis integrationen opretter en Preview
      # Branch for PR'en, bygger vi mod den. Hvis ikke, bygger vi mod produktion
      # med en tydelig advarsel i log og job-summary.
      #
      # Branch-projektets ref og publishable key hentes fra Management API'et og
      # skrives til GITHUB_ENV, hvor build-trinnet nedenfor samler dem op.
      - if: github.event.action != 'closed'
        name: Find PR'ens Supabase Preview Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PARENT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
          GIT_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
          FALLBACK_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          FALLBACK_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -uo pipefail
          echo "SUPABASE_PREVIEW_BRANCH_USED=false" >> "$GITHUB_ENV"

          # Bruges, når der ikke er en brugbar Preview Branch for PR'en.
          use_production() {
            echo "::warning::$1 -- preview'et bygges mod PRODUKTIONS-Supabase."
            {
              echo "VITE_SUPABASE_URL=$FALLBACK_URL"
              echo "VITE_SUPABASE_PUBLISHABLE_KEY=$FALLBACK_KEY"
              echo "SUPABASE_PREVIEW_BRANCH_USED=false"
            } >> "$GITHUB_ENV"
            echo "⚠️ Preview bygget mod **produktions**-databasen: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PARENT_REF:-}" ]; then
            use_production "SUPABASE_ACCESS_TOKEN eller SUPABASE_PROJECT_REF er ikke sat"
          fi

          api() {
            curl -sS --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$1"
          }

          # Supabase opretter ofte branchen lidt efter synchronize-eventet.
          # 24 forsøg á 10 sekunder giver ~4 minutters timeout-budget.
          attempts=24
          echo "Leder efter Supabase Preview Branch for '$GIT_BRANCH' / PR #$PR_NUMBER."

          branch_ref=""
          publishable=""

          for attempt in $(seq 1 "$attempts"); do
            if [ -z "$branch_ref" ]; then
              branches=$(api "https://api.supabase.com/v1/projects/$PARENT_REF/branches")
              if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$branches"; then
                # is_default er produktions-branchen; den må vi aldrig ramme her.
                branch_ref=$(jq -r --arg b "$GIT_BRANCH" --arg pr "$PR_NUMBER" '
                  map(select(
                    (.is_default // false) != true
                    and (((.git_branch // "") == $b) or (((.pr_number // 0) | tostring) == $pr))
                  ))
                  | .[0]
                  | (.project_ref // .ref // empty)
                ' <<<"$branches")
              fi
            fi

            if [ -n "$branch_ref" ]; then
              keys=$(api "https://api.supabase.com/v1/projects/$branch_ref/api-keys?reveal=true")
              if jq -e 'type == "array"' >/dev/null 2>&1 <<<"$keys"; then
                # Nyt nøglesystem først (sb_publishable_...), ellers den gamle anon-JWT.
                publishable=$(jq -r '
                  (map(select((.type // "") == "publishable")) | .[0].api_key)
                  // (map(select((.name // "") == "anon")) | .[0].api_key)
                  // empty
                ' <<<"$keys")
              fi
            fi

            [ -n "$branch_ref" ] && [ -n "$publishable" ] && break
            echo "Venter på Supabase Preview Branch for '$GIT_BRANCH' (forsøg $attempt/$attempts)…"
            if [ "$attempt" -lt "$attempts" ]; then sleep 10; fi
          done

          if [ -z "$branch_ref" ]; then
            use_production "Supabase oprettede ingen Preview Branch for PR #$PR_NUMBER"
          fi

          if [ -z "$publishable" ]; then
            echo "::error::Supabase Preview Branch '$branch_ref' mangler publishable key."
            echo "Tjek at SUPABASE_ACCESS_TOKEN stadig kan læse branchens API keys." >&2
            exit 1
          fi

          echo "::add-mask::$publishable"
          {
            echo "VITE_SUPABASE_URL=https://$branch_ref.supabase.co"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_PREVIEW_BRANCH_USED=true"
          } >> "$GITHUB_ENV"
          echo "✅ Preview bygget mod Supabase Preview Branch \`$branch_ref\`." >> "$GITHUB_STEP_SUMMARY"

      - if: github.event.action != 'closed' && env.SUPABASE_PREVIEW_BRANCH_USED == 'true'
        name: Kontrollér trusted IP-header i Preview
        # Supabase GitHub-integrationen deployer functionen fra config.toml til
        # Preview Branch. Cloudflare skal enten afvise en caller-sat
        # CF-Connecting-IP eller overskrive den. Derefter skal en spoofet,
        # multipel X-Forwarded-For ignoreres, så den platform-satte
        # CF-Connecting-IP stadig lader requestet nå body-valideringen (HTTP 400).
        run: |
          set -euo pipefail
          endpoint="$VITE_SUPABASE_URL/functions/v1/submit-probation-application"
          common_args=(
           --silent --show-error --max-time 30
           --request POST "$endpoint"
           --oauth2-bearer "$VITE_SUPABASE_PUBLISHABLE_KEY"
           --header 'Content-Type: application/json'
           --header "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY"
           --data '{}'
          )

          spoof_status=$(curl "${common_args[@]}" \
           --output /tmp/probation-cf-spoof.json \
           --write-out '%{http_code}' \
           --header 'CF-Connecting-IP: caller-controlled-invalid-value')
          if [ "$spoof_status" = "403" ] && grep -q 'error code: 1000' /tmp/probation-cf-spoof.json; then
           echo "Cloudflare afviste caller-sat CF-Connecting-IP."
          elif [ "$spoof_status" = "400" ]; then
           echo "Cloudflare overskrev caller-sat CF-Connecting-IP."
          else
           echo "::error::Uventet HTTP $spoof_status ved spoofet CF-Connecting-IP."
           exit 1
          fi

          status=""

          for attempt in $(seq 1 24); do
           status=$(curl "${common_args[@]}" \
             --output /tmp/probation-header-check.json \
             --write-out '%{http_code}' \
             --header 'X-Forwarded-For: 203.0.113.9, 192.0.2.1') || status="000"
           [ "$status" = "400" ] && break
           echo "Venter på Preview-functionen (forsøg $attempt/24, HTTP $status)…"
           if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done

          if [ "$status" != "400" ]; then
           echo "::error::Preview-functionen gav HTTP $status; forventede 400 med platformens CF-header og ignoreret XFF."
           exit 1
          fi
          echo "✅ Supabase Preview afviste/overskrev spoofet CF-Connecting-IP og functionen ignorerede spoofet X-Forwarded-For." >> "$GITHUB_STEP_SUMMARY"

      - if: github.event.action != 'closed'
        name: Build preview
        # VITE_SUPABASE_* kommer fra trinnet ovenfor via GITHUB_ENV og må derfor
        # ikke sættes her -- en env-nøgle på selve trinnet ville overskrive dem
        # med produktionsværdierne igen. Vite-configen fejler buildet, hvis de
        # er tomme.
        run: npm run build
        env:
          VITE_BASE_PATH: /naturklubben/pr-preview/pr-${{ github.event.number }}/

      # Håndterer både deploy (åbnet/opdateret PR) og oprydning (lukket PR)
      # automatisk ud fra event-typen ovenfor.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
