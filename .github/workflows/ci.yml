name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # V2 er produktionsappen (deploy.yml udgiver V2/dist). Test, lint, typecheck
  # og formatering kører her, så en PR ikke kan slippe igennem med en V2,
  # der ikke bygger eller fejler sine tjek.
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # V2 har sin egen package-lock.json; uden den peger npm-cachen på
          # rodens lockfil og cache-nøglen rammer forbi.
          cache-dependency-path: V2/package-lock.json

      - name: Install
        working-directory: V2
        run: npm ci

      - name: Test
        working-directory: V2
        run: npm test

      - name: Lint
        working-directory: V2
        run: npm run lint

      - name: Typecheck
        working-directory: V2
        run: npx tsc -b

      - name: Format check
        working-directory: V2
        run: npx prettier --check .
