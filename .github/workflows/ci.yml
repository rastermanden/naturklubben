name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unikke migration-versioner
        # supabase db push sporer anvendte migrations på versionsnummeret alene.
        # Deler to filer nummer, bliver den, der merges sidst, sprunget over uden
        # fejl -- og tabellen mangler så i produktion (skete for
        # probation_applications). Fang det i PR'en i stedet.
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Flere migrations deler versionsnummer: $dupes"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --config peger på supabase/deno.json, som slår node_modules fra for
      # Deno. Uden den ser Deno repoets package.json, bruger node_modules som
      # kilde til npm-pakker og kræver, at den installerede @supabase/supabase-js
      # er præcis den version, Edge Functions pinner -- så hver gang Dependabot
      # hæver package.json, blev dette job rødt. Edge Functions kører aldrig med
      # node_modules, så her hentes pakken fra registry'et, som ved deploy.
      - name: Test Edge Function-hjælpere
        run: deno test --config supabase/deno.json supabase/functions/_shared/*.test.ts

      - name: Typecheck Edge Functions
        run: deno check --config supabase/deno.json supabase/functions/*/index.ts

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Format check
        run: npm run format:check

  database:
    runs-on: ubuntu-latest
    services:
      # Supabase's egen Postgres-build, så de extensions migrationerne bruger
      # (pgcrypto, citext, pg_net, pg_cron, pgTAP) findes med samme versioner
      # som i produktion. Taggen bør følge projektets Postgres-version.
      #
      # Bemærk: dette bryder ikke no-Docker-princippet i CLAUDE.md. Princippet
      # handler om, hvad en *bidragyder* skal have installeret; en service
      # container kører i GitHub's runner og kræver intet af nogen.
      postgres:
        image: supabase/postgres:17.6.1.165
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      # supabase_admin, ikke postgres: imaget ejer auth- og storage-skemaerne med
      # den rolle, og postgres-rollen har hverken lov til at oprette
      # storage.objects eller at lægge allowlist-triggeren på auth.users. I et
      # rigtigt Supabase-projekt findes de objekter allerede, når migrationerne
      # kører; her skal de først op. Imaget sætter samme adgangskode på
      # supabase_admin som på postgres.
      PGUSER: supabase_admin
      PGPASSWORD: postgres
      PGDATABASE: postgres
      # supabase_admin har som standard auth i sin search_path. Kør med samme
      # search_path som produktionens postgres-rolle, så et ukvalificeret navn
      # aldrig kan opføre sig anderledes i CI end i produktion.
      PGOPTIONS: -c search_path=public,extensions
    steps:
      - uses: actions/checkout@v7

      - name: Afspil migrationer og kør pgTAP-tests
        run: supabase/tests/run.sh
