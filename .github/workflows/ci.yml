name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unikke migration-versioner
        # supabase db push sporer anvendte migrations på versionsnummeret alene.
        # Deler to filer nummer, bliver den, der merges sidst, sprunget over uden
        # fejl -- og tabellen mangler så i produktion (skete for
        # probation_applications). Fang det i PR'en i stedet.
        run: |
          dupes=$(ls supabase/migrations/*.sql | xargs -n1 basename | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Flere migrations deler versionsnummer: $dupes"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test Edge Function-hjælpere
        run: deno test supabase/functions/_shared/*.test.ts

      - name: Typecheck Edge Functions
        run: deno check supabase/functions/*/index.ts

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Format check
        run: npm run format:check

  database:
    runs-on: ubuntu-latest
    services:
      # Supabase's egen Postgres-build, så de extensions migrationerne bruger
      # (pgcrypto, citext, pg_net, pg_cron, pgTAP) findes med samme versioner
      # som i produktion. Taggen bør følge projektets Postgres-version.
      #
      # Bemærk: dette bryder ikke no-Docker-princippet i CLAUDE.md. Princippet
      # handler om, hvad en *bidragyder* skal have installeret; en service
      # container kører i GitHub's runner og kræver intet af nogen.
      postgres:
        image: supabase/postgres:17.6.1.165
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Afspil migrationer og kør pgTAP-tests
        run: supabase/tests/run.sh
