<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Naturklubben</title>
    <script>
      ;(function () {
        var base = "/naturklubben/pr-preview/pr-277/"
        var path = location.pathname
        if (path.indexOf(base) !== 0) {
          location.replace(base)
          return
        }
        var rest = path.slice(base.length)
        if (/[.][^/]+$/.test(rest)) return
        var query = location.search ? location.search.slice(1) + '&' : ''
        location.replace(
          base + '?' + query + 'spa-path=' + encodeURIComponent(rest) + location.hash,
        )
      })()
    </script>
  </head>
  <body>
    <p>Siden findes ikke. <a href="/naturklubben/pr-preview/pr-277/">Gå til Naturklubben</a>.</p>
  </body>
</html>
