<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naturklubben</title>
    <script>
      function computeSpaFallback(base, pathname, search, hash) {
	let current = base;
	if (pathname.indexOf(current) !== 0) return current;
	let rest = pathname.slice(current.length);
	const preview = rest.match(/^pr-preview[/]pr-[0-9]+[/]/);
	if (preview !== null) {
		current += preview[0];
		rest = rest.slice(preview[0].length);
	}
	if (/[.][^/]+$/.test(rest)) return null;
	const query = search.length > 0 ? search.slice(1) + "&" : "";
	return current + "?" + query + "spa-path=" + encodeURIComponent(rest) + hash;
}
      ;(function () {
        var target = computeSpaFallback(
          "/pr-preview/pr-277/",
          location.pathname,
          location.search,
          location.hash,
        )
        if (target !== null) location.replace(target)
      })()
    </script>
  </head>
  <body>
    <p>Siden findes ikke. <a href="/pr-preview/pr-277/">Gå til Naturklubben</a>.</p>
  </body>
</html>
